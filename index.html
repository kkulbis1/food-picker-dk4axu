<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kovas &amp; Lynsey's Food</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --cream:#FBF5EE; --paper:#FFFDF9; --ink:#2D2A26; --soft:#6E655C; --line:#EADFD2;
  --terra:#C8553D; --terra-d:#A8432E; --sage:#5E8C6A; --butter:#F2C14E; --plum:#7A4E6D;
  --love:#D6455D; --like:#3E8E5E; --maybe:#C99A2E; --no:#7B7570;
  --serif:"Iowan Old Style","New York","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:22px; --shadow:0 14px 40px -18px rgba(80,45,20,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(251,245,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--serif);font-size:17px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:#E8F1EA;color:#2F6B43;white-space:nowrap}
.pill.bad{background:#FBE3DE;color:#9A2F1C;font-weight:600}
.btn-mini{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:600;white-space:nowrap}

/* generic */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px 18px;font-size:17px;font-weight:650;background:var(--terra);color:#fff;box-shadow:0 8px 20px -10px rgba(200,85,61,.8)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.sage{background:var(--sage);box-shadow:0 8px 20px -10px rgba(94,140,106,.8)}
.btn.huge{font-size:20px;padding:20px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.muted{color:var(--soft)}
.small{font-size:13px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:0 2px 0 rgba(0,0,0,.02)}
.link{background:none;border:0;color:var(--terra-d);text-decoration:underline;padding:6px 0;font-size:14px}
.stack>*+*{margin-top:10px}

/* welcome */
.hero{padding:34px 4px 6px;text-align:center}
.hero .plate{font-size:58px;line-height:1;margin-bottom:12px}
.hero h1{font-size:34px;line-height:1.1}
.hero p{font-size:17px;line-height:1.5;color:var(--soft);margin:12px auto 0;max-width:420px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.steps .n{width:32px;height:32px;border-radius:50%;background:var(--butter);display:grid;place-items:center;font-weight:700;flex:none}

/* interview */
.ihead{padding:20px 2px 4px}
.ihead .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra-d);font-weight:700}
.ihead h2{font-size:26px;margin-top:4px}
.dots{display:flex;gap:6px;margin-top:10px}
.dots i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--terra)}
.q{margin:14px 0}
.q h3{font-size:18px;margin-bottom:4px}
.q .hint{font-size:13px;color:var(--soft);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:10px 14px;font-size:15px;min-height:44px;transition:background .12s,border-color .12s}
.chip[data-state="yes"]{background:#E7F2EA;border-color:var(--sage);color:#1F5132;font-weight:600}
.chip[data-state="yes"]::before{content:"💚 "}
.chip[data-state="no"]{background:#F6E1DC;border-color:#D58E7E;color:#8A2E1C;text-decoration:line-through;text-decoration-thickness:1.5px}
.chip[data-state="no"]::before{content:"🚫 ";display:inline-block;text-decoration:none}
.chip.sel{background:#E7F2EA;border-color:var(--sage);color:#1F5132;font-weight:600}
.chip.sel::before{content:"✓ "}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink);resize:vertical}
textarea{min-height:76px}
textarea:focus,input:focus{outline:none;border-color:var(--terra)}
.other{margin-top:10px}
.lv{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lv:last-of-type{border-bottom:0}
.lv .lbl{flex:1;min-width:0;font-size:15px;font-weight:550;line-height:1.25}
.seg{display:flex;gap:4px;flex:none}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:11px;width:50px;height:48px;padding:0;font-size:10.5px;font-weight:650;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.seg button .e{font-size:17px}
.seg button.on{color:var(--ink)}
.seg button.on[data-v=love]{background:#FBE4E8;border-color:var(--love)}
.seg button.on[data-v=like]{background:#E5F2E9;border-color:var(--like)}
.seg button.on[data-v=fine]{background:#FFF4D6;border-color:var(--maybe)}
.seg button.on[data-v=dislike]{background:#EEEAE6;border-color:var(--no)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--soft);margin:0 0 6px}
.notewrap{margin-top:12px}
.notebtn{width:100%;border:1.5px dashed #D9C9B6;background:transparent;border-radius:14px;min-height:46px;font-size:15px;font-weight:600;color:var(--terra-d)}
.notewrap textarea{min-height:64px;font-size:16px}
.notewrap .small{margin:4px 2px 0}
.rnote{margin-top:6px;font-size:14px;padding:8px 10px;border-radius:10px}
.notetxt{font-size:12.5px;color:var(--terra-d);font-style:italic;display:block;margin-top:2px}
.rnbtn{background:none;border:0;color:var(--terra-d);font-size:12px;padding:2px 0;text-decoration:underline}
@media(max-width:380px){.seg button{width:44px;height:46px;font-size:9.5px}.lv .lbl{font-size:14px}}
.rules{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:8px}
.rules li{display:flex;gap:10px;align-items:center;background:#F3EEE7;border-radius:12px;padding:10px 12px;font-size:15px}
.rules li b{font-weight:650}
.lock{margin-left:auto;font-size:12px;color:var(--soft)}
.prefs{font-size:14px;color:var(--soft);line-height:1.5;margin:10px 0 0}
.navbar{display:flex;gap:10px;margin-top:22px}
.navbar .btn.ghost{flex:0 0 34%}

/* cards */
.deckhead{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 8px;gap:10px}
.progress{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 2px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--butter),var(--terra));border-radius:9px;transition:width .25s}
.card{position:relative;margin:14px 0 0;border-radius:28px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease,opacity .18s}
.card .art{height:190px;display:grid;place-items:center;position:relative}
.card .art .em{font-size:96px;line-height:1;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.card .art .badge{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.85);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card .art .cur{position:absolute;right:14px;top:14px;background:#fff;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:650}
.cat-b .art{background:radial-gradient(circle at 30% 20%,#FFF2CC,#F6C97A 60%,#EFA95A)}
.cat-l .art{background:radial-gradient(circle at 30% 20%,#EEF5E4,#BFD8A8 60%,#8DB98A)}
.cat-d .art{background:radial-gradient(circle at 30% 20%,#FBE2D6,#E79A7C 60%,#C8553D)}
.cat-s .art{background:radial-gradient(circle at 30% 20%,#F8E3EE,#DDA5C3 60%,#A86C8E)}
.card .body{padding:18px 20px 20px}
.card h2{font-size:27px;line-height:1.12}
.card p.desc{font-size:17px;line-height:1.45;color:#4A433C;margin:8px 0 14px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:13px;background:#F3EEE7;border-radius:99px;padding:6px 10px;color:#5A5148}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate button{border:0;border-radius:18px;min-height:78px;background:#fff;box-shadow:0 6px 16px -10px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:650;border:2px solid transparent}
.rate button .e{font-size:30px;line-height:1}
.rate button.love{color:var(--love)} .rate button.like{color:var(--like)} .rate button.maybe{color:#8F6A12} .rate button.no{color:var(--no)}
.rate button.on{border-color:currentColor;background:#FFF7F0}
.rate button:active{transform:scale(.96)}
.subnav{display:flex;gap:8px;margin-top:10px}
.subnav button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;min-height:48px;font-size:15px;font-weight:600}
.subnav button:disabled{opacity:.4}
.gfnote{font-size:12.5px;color:var(--soft);text-align:center;margin:14px 8px 0;line-height:1.4}
.done{text-align:center;padding:26px 18px}
.done .big{font-size:56px}

/* review */
.group{margin:16px 0}
.group h3{font-size:20px;display:flex;align-items:center;gap:8px}
.group h3 .ct{font-family:var(--sans);font-size:13px;background:var(--line);border-radius:99px;padding:2px 9px;color:var(--soft)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ie{font-size:26px;flex:none;width:34px;text-align:center}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:15px;font-weight:650}
.item .nm span{font-size:12px;color:var(--soft)}
.mini{display:flex;gap:3px;flex:none}
.mini button{border:1.5px solid var(--line);background:#fff;border-radius:10px;width:34px;height:34px;font-size:16px;padding:0;display:grid;place-items:center}
.mini button.on{border-color:var(--terra);background:#FFF1EA}
details summary{cursor:pointer;font-weight:650;padding:6px 0}
.answers dt{font-weight:650;font-size:14px;margin-top:10px}
.answers dd{margin:2px 0 0;font-size:14px;color:#4A433C;white-space:pre-wrap}
.callout{background:#FFF6DC;border:1px solid #F0D98F;border-radius:16px;padding:14px;font-size:14px;line-height:1.45}
.callout.warn{background:#FBE3DE;border-color:#E9A898}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:24px;max-width:520px;width:100%;padding:22px;box-shadow:var(--shadow);max-height:85vh;overflow:auto}
.modal h3{font-size:22px;margin-bottom:8px}
.modal p{line-height:1.45}
@media(min-width:600px){.modal-bg{align-items:center}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:92vw;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer.foot{text-align:center;padding:10px 16px 30px;font-size:13px;color:var(--soft)}
footer.foot button{background:none;border:0;color:var(--soft);text-decoration:underline;font-size:13px;padding:6px}
@media(max-width:380px){.rate button{min-height:70px;font-size:11.5px}.rate button .e{font-size:26px}.card h2{font-size:24px}.brand{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">🍽️ Kovas &amp; Lynsey's Food</div>
  <span id="savePill" class="pill">…</span>
  <button class="btn-mini" data-act="backup" title="Download a backup file of everything so far">💾 Backup</button>
</div></header>
<main class="wrap" id="app"></main>
<footer class="foot">
  <button data-act="import">Restore from backup file</button> ·
  <button data-act="summaryTxt">Download readable summary</button> ·
  <button data-act="reset">Start over</button>

</footer>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

/* ---------- State ---------- */

function nowISO() { return new Date().toISOString(); }
function freshState() {
  return { schema: SCHEMA, appVersion: APP_VERSION, startedAt: nowISO(), updatedAt: nowISO(),
           step: "welcome", ipage: 0, interview: { rulesConfirmed: false }, deck: [], pos: 0,
           ratings: {}, notes: {}, history: [], lastExportAt: null, ratingsSinceExport: 0 };
}

/* Validate & clean any incoming state (from localStorage or an imported file). */
function sanitizeState(raw) {
  if (!raw || typeof raw !== "object") throw new Error("Not a saved questionnaire.");
  const s = freshState();
  s.startedAt = typeof raw.startedAt === "string" ? raw.startedAt : s.startedAt;
  s.step = ["welcome", "interview", "cards", "review"].includes(raw.step) ? raw.step : "welcome";
  s.ipage = Number.isInteger(raw.ipage) ? Math.min(Math.max(raw.ipage, 0), PAGES.length - 1) : 0;
  if (raw.interview && typeof raw.interview === "object") {
    for (const [k, v] of Object.entries(raw.interview)) {
      if (typeof v === "string") s.interview[k] = v.slice(0, 5000);
      else if (typeof v === "boolean") s.interview[k] = v;
      else if (Array.isArray(v)) s.interview[k] = v.filter(x => typeof x === "string").slice(0, 50);
      else if (v && typeof v === "object") {
        s.interview[k] = {};
        const legacy = { yes: "love", no: "dislike" };   // v1.0 tri-state answers
        for (const [lk, lv] of Object.entries(v)) {
          const nv = LEVELS[lv] ? lv : legacy[lv];
          if (nv) s.interview[k][lk] = nv;
        }
      }
    }
  }
  s.deck = Array.isArray(raw.deck) ? [...new Set(raw.deck.filter(id => BY_ID[id]))] : [];
  s.pos = Number.isInteger(raw.pos) ? Math.min(Math.max(raw.pos, 0), s.deck.length) : 0;
  if (raw.ratings && typeof raw.ratings === "object") {
    for (const [id, v] of Object.entries(raw.ratings)) {
      if (BY_ID[id] && v && RATINGS[v.r]) s.ratings[id] = { r: v.r, at: typeof v.at === "string" ? v.at : nowISO() };
    }
  }
  if (raw.notes && typeof raw.notes === "object") {
    for (const [id, t] of Object.entries(raw.notes)) if (BY_ID[id] && typeof t === "string" && t.trim()) s.notes[id] = t.slice(0, 1000);
  }
  s.history = Array.isArray(raw.history) ? raw.history.filter(h => h && BY_ID[h.id]).slice(-200).map(h => ({
    id: h.id, prev: h.prev && RATINGS[h.prev.r] ? { r: h.prev.r, at: String(h.prev.at || "") } : null,
    pos: Number.isInteger(h.pos) ? h.pos : null })) : [];
  s.lastExportAt = typeof raw.lastExportAt === "string" ? raw.lastExportAt : null;
  s.ratingsSinceExport = Number.isInteger(raw.ratingsSinceExport) ? raw.ratingsSinceExport : 0;
  return s;
}

function save() {
  S.updatedAt = nowISO();
  try {
    const txt = JSON.stringify(S);
    localStorage.setItem(LS_KEY, txt);
    if (localStorage.getItem(LS_KEY) !== txt) throw new Error("Save could not be verified");
    storageOK = true; lastSaveError = "";
  } catch (e) {
    storageOK = false; lastSaveError = String(e && e.message || e);
  }
  updatePill();
}
let saveTimer = null;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }

function load() {
  try {
    const txt = localStorage.getItem(LS_KEY);
    if (txt) S = sanitizeState(JSON.parse(txt));
    localStorage.setItem(LS_KEY + ".probe", "1"); localStorage.removeItem(LS_KEY + ".probe");
    storageOK = true;
  } catch (e) {
    storageOK = false; lastSaveError = String(e && e.message || e);
  }
}

function updatePill() {
  const p = document.getElementById("savePill");
  if (storageOK) {
    p.className = "pill";
    p.textContent = "✓ Saved " + new Date(S.updatedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    p.title = "Saved in this browser. Still tap Backup now and then to keep a file copy.";
  } else {
    p.className = "pill bad";
    p.textContent = "⚠ Not auto-saving";
    p.title = "This browser is not allowing automatic saving (" + lastSaveError + "). Tap Backup to keep your answers.";
  }
}

/* ---------- Helpers ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function hashTie(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 997; return h / 10000; }
function ratedCount(kind) { return Object.values(S.ratings).filter(v => kind ? v.r === kind : v.r !== "skipped").length; }
let toastTimer = null;
function toast(msg, ms = 2600) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
function modal({ title, body, ok = "OK", cancel = "Cancel", danger = false, onOk }) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">
    <h3>${esc(title)}</h3><div>${body}</div>

      <button class="btn ${danger ? "" : "sage"}" data-m="ok">${esc(ok)}</button>
    </div></div></div>`;
  root.querySelector("[data-m=ok]").onclick = () => { root.innerHTML = ""; onOk && onOk(); };
  const c = root.querySelector("[data-m=cancel]"); if (c) c.onclick = () => { root.innerHTML = ""; };
}

/* ---------- Relevance scoring ---------- */
function refuseWords() {
  return (S.interview.refuse || "").toLowerCase().split(/,|\n|;|\band\b/).map(w => w.trim()).filter(w => w.length >= 3);
}
function scoreMeal(m) {
  const iv = S.interview, tags = new Set(m.tags);
  let s = 0;
  const apply = (qid, yesW, noW) => {
    const q = Q_BY_ID[qid], v = iv[qid]; if (!v) return;
    for (const [label, otags] of q.opts) {
      if (!otags || !otags.some(t => tags.has(t))) continue;
      if (q.type === "levels") {
        const lv = v[label]; if (!lv || !LEVELS[lv]) continue;
        s += lv === "dislike" ? noW : yesW * LEVELS[lv].w;
      } else if (v.includes(label)) s += yesW;
    }
  };
  apply("proteins", 3, -9); apply("veg", 1.5, -5); apply("cuisines", 2, -5);
  apply("sauces", 2, 0); apply("pasta", 2.5, 0); apply("breakfast", 2.5, 0); apply("snacks", 2, 0);
  apply("cravings", 1, 0); apply("textures", -2.5, 0); apply("aversions", -6, 0);
  const soupish = tags.has("soup") || tags.has("stew");
  if (iv.soups === "Love them — lots please" && soupish) s += 2;
  if (iv.soups === "Rarely" && soupish) s -= 4;
  if (iv.casseroles === "Love them — lots please" && (tags.has("casserole") || tags.has("pastabake"))) s += 2;
  if (iv.casseroles === "Rarely" && tags.has("casserole")) s -= 4;
  if (iv.dairy === "Keep it light" && (tags.has("rich") || tags.has("cheesy"))) s -= 3;
  if (iv.dairy === "Love them" && (tags.has("cheesy") || tags.has("creamy"))) s += 1;
  if (iv.heat === "None at all" && (tags.has("curry") || tags.has("indian"))) s -= 1;
  // Lynsey's known loves
  if (["pasta", "lasagna", "meatball", "waffle"].some(t => tags.has(t))) s += 1.5;
  // Hard "refuse" words hide the meal
  const text = (m.name + " " + m.desc).toLowerCase();
  if (refuseWords().some(w => text.includes(w))) s -= 50;
  return s + hashTie(m.id);
}

const CAPS = { lasagna: 4, waffle: 4, meatball: 4, soup: 5, burrito: 3, eggbite: 2, pasta: 8, muffin: 3, frozen: 2 };
function buildDeck(exclude = new Set()) {
  const scored = MEALS.filter(m => !exclude.has(m.id)).map(m => ({ m, s: scoreMeal(m) })).sort((a, b) => b.s - a.s);
  const picked = { b: [], l: [], d: [], s: [] }, capCount = {};
  for (const { m, s } of scored) {
    if (s <= -6) continue;
    const k = m.catKey;
    if (picked[k].length >= DECK_QUOTA[k]) continue;
    if (m.tags.some(t => CAPS[t] && (capCount[t] || 0) >= CAPS[t])) continue;
    picked[k].push(m.id);
    m.tags.forEach(t => { if (CAPS[t]) capCount[t] = (capCount[t] || 0) + 1; });
  }
  // Interleave categories so the deck feels varied
  const pattern = ["d", "b", "l", "d", "b", "s", "d", "l", "b", "d", "l", "s"], out = [];
  let guard = 0;
  while (Object.values(picked).some(a => a.length) && guard++ < 1000) {
    for (const k of pattern) if (picked[k].length) out.push(picked[k].shift());
  }
  return out;
}
function addMoreMeals() {
  const inDeck = new Set(S.deck);
  const more = MEALS.filter(m => !inDeck.has(m.id) && !S.ratings[m.id])
    .map(m => ({ id: m.id, s: scoreMeal(m) })).filter(x => x.s > -40)
    .sort((a, b) => b.s - a.s).slice(0, MORE_COUNT).map(x => x.id);
  if (!more.length) { toast("You've seen every meal in the catalog!"); return; }
  S.deck.push(...more); save(); render();
  toast(`Added ${more.length} more meals`);
}
function startCards() {
  if (!S.deck.length) {
    S.deck = buildDeck(); S.pos = 0;
  } else {
    // Re-prioritize meals not yet reached, using any updated interview answers
    const prefix = S.deck.slice(0, S.pos);
    const keep = new Set(prefix);
    const tail = buildDeck(keep).filter(id => !S.ratings[id]);
    const target = Math.max(S.deck.length - S.pos, 0);
    S.deck = prefix.concat(tail.slice(0, target));
  }
  S.step = "cards"; save(); render(true);
}

/* ---------- Rating actions ---------- */
function rate(r) {
  const id = S.deck[S.pos]; if (!id) return;
  noteOpen = false;
  const prev = S.ratings[id] || null;
  S.history.push({ id, prev, pos: S.pos }); if (S.history.length > 200) S.history.shift();
  S.ratings[id] = { r, at: nowISO() };
  S.pos++; S.ratingsSinceExport++;
  save(); render();
  if (r !== "skipped" && S.ratingsSinceExport > 0 && S.ratingsSinceExport % 15 === 0)
    toast("💾 Nice progress! Tap Backup in the top corner to save a checkpoint file.", 4200);
}
function setRating(id, r) {
  const prev = S.ratings[id] || null;
  S.history.push({ id, prev, pos: null });
  if (r) S.ratings[id] = { r, at: nowISO() }; else delete S.ratings[id];
  save(); render();
}
function undo() {
  const h = S.history.pop();
  if (!h) { toast("Nothing to undo"); return; }
  if (h.prev) S.ratings[h.id] = h.prev; else delete S.ratings[h.id];
  if (h.pos != null && S.step === "cards") S.pos = Math.min(h.pos, S.deck.length);
  save(); render(); toast("Undid: " + BY_ID[h.id].name);
}

/* ---------- Export / import ---------- */
function interviewReadable() {
  const iv = S.interview, out = [];
  out.push({ question: "Household rules confirmed", answer: iv.rulesConfirmed ? "Yes — confirmed" : "Not confirmed yet" });
  for (const q of QUESTIONS) {
    if (q.type === "rules") continue;
    let a = "";
    const v = iv[q.id];
    if (q.type === "levels") {
      a = Object.keys(LEVELS).map(lv => {
        const items = q.opts.map(o => o[0]).filter(l => (v || {})[l] === lv);
        return items.length ? LEVELS[lv].l + ": " + items.join(", ") : "";
      }).filter(Boolean).join(" | ");
    } else if (q.type === "multi") a = (v || []).join(", ");
    else a = v || "";
    const other = iv[q.id + "_other"];
    if (other) a = (a ? a + " | " : "") + "Other: " + other;
    out.push({ id: q.id, question: q.label, answer: a || "(no answer)" });
  }
  return out;
}
function groupRatings() {
  const g = { love: [], like: [], maybe: [], no: [], skipped: [] };
  for (const m of MEALS) {
    const v = S.ratings[m.id];
    if (v) g[v.r].push({ id: m.id, name: m.name, category: m.cat, description: m.desc, tags: m.tags,
                         handsOnMinutes: m.effort, freezer: m.freezer, equipment: m.eq, ratedAt: v.at,
                         note: S.notes[m.id] || "" });
  }
  return g;
}
function mealNotes() {
  return MEALS.filter(m => S.notes[m.id]).map(m => ({ id: m.id, name: m.name, category: m.cat,
    rating: S.ratings[m.id] ? S.ratings[m.id].r : null, note: S.notes[m.id] }));
}
function summaryText() {
  const g = groupRatings(), unseen = MEALS.filter(m => !S.ratings[m.id]);
  const L = [];
  L.push("KOVAS & LYNSEY'S FOOD — Lynsey's answers");
  L.push("Exported: " + new Date().toLocaleString());
  L.push(`Progress: ${g.love.length} love, ${g.like.length} like, ${g.maybe.length} maybe, ${g.no.length} no, ${g.skipped.length} skipped, ${unseen.length} never shown (of ${MEALS.length} in catalog).`);
  L.push("");
  L.push("HOUSEHOLD RULES (fixed, not changed by preferences):");
  HOUSE_RULES.forEach(r => L.push("- " + r[1] + (r[2] ? " (" + r[2] + ")" : "")));
  L.push("- " + HOUSE_PREFS);
  L.push("");
  L.push("INTERVIEW");
  interviewReadable().forEach(x => L.push("- " + x.question + ": " + x.answer));
  for (const k of ["love", "like", "maybe", "no", "skipped"]) {
    L.push(""); L.push(`${RATINGS[k].e} ${RATINGS[k].l.toUpperCase()} (${g[k].length})`);
    g[k].forEach(x => L.push(`- ${x.name} [${x.category}]` + (x.note ? `\n    Note: ${x.note}` : "")));
  }
  const unratedNotes = mealNotes().filter(n => !n.rating);
  if (unratedNotes.length) { L.push(""); L.push("NOTES ON UNRATED DISHES"); unratedNotes.forEach(n => L.push(`- ${n.name}: ${n.note}`)); }
  L.push(""); L.push(`NOT SHOWN / NOT RATED (${unseen.length}) — do not treat these as approved.`);
  return L.join("\n");
}
function buildExport(kind) {
  const g = groupRatings(), unseen = MEALS.filter(m => !S.ratings[m.id]);
  return {
    schema: SCHEMA, appVersion: APP_VERSION, exportType: kind, exportedAt: nowISO(), respondent: "Lynsey",
    readMe: "Meal-preference answers for batch cooking. 'ratings' are explicit choices; each may carry a 'note' with Lynsey's requested changes (e.g. less garlic). 'mealNotes' lists every dish note. 'skipped' were shown but not rated. 'unseen' were never shown — do NOT treat them as approved. All meals are planned gluten-free, peanut-free, shellfish-free, pregnancy-safe, no grill, no black beans, not very spicy.",
    progress: { step: S.step, startedAt: S.startedAt, updatedAt: S.updatedAt, catalogSize: MEALS.length, deckSize: S.deck.length,
                deckPosition: S.pos, loved: g.love.length, liked: g.like.length, maybe: g.maybe.length, rejected: g.no.length,
                skipped: g.skipped.length, unseen: unseen.length },
    householdRules: HOUSE_RULES.map(r => r[1] + (r[2] ? " (" + r[2] + ")" : "")),
    householdPreferences: HOUSE_PREFS,
    rulesConfirmedByLynsey: !!S.interview.rulesConfirmed,
    rulesCorrectionNote: S.interview.rulesNote || "",
    interviewAnswers: interviewReadable(),
    ratings: { love: g.love, like: g.like, maybe: g.maybe, no: g.no },
    skipped: g.skipped,
    mealNotes: mealNotes(),
    unseen: unseen.map(m => ({ id: m.id, name: m.name, category: m.cat })),
    summaryText: summaryText(),
    state: S
  };
}
function stamp() { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function downloadText(filename, text, mime) {
  try {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
    return true;
  } catch (e) {
    showCopyFallback(text, "Download didn't work here");
    return false;
  }
}
function exportJSON(kind) {
  const name = `Lynsey_Food_Answers_${kind === "final" ? "FINAL_" : "backup_"}${stamp()}.json`;
  const ok = downloadText(name, JSON.stringify(buildExport(kind), null, 2), "application/json");
  if (ok) {
    S.lastExportAt = nowISO(); S.ratingsSinceExport = 0; save();
    window.__lastExportName = name;
    toast(`💾 Saved file "${name}" — check Downloads`, 4500);
  }
}
async function shareJSON() {
  const name = `Lynsey_Food_Answers_FINAL_${stamp()}.json`;
  const text = JSON.stringify(buildExport("final"), null, 2);
  try {
    const file = new File([text], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Lynsey's food answers" });
      S.lastExportAt = nowISO(); S.ratingsSinceExport = 0; save();
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  showCopyFallback(text, "Sharing isn't available here");
}
async function copyJSON() {
  const text = JSON.stringify(buildExport("final"), null, 2);
  try { await navigator.clipboard.writeText(text); toast("Copied all answers — paste into a message or note"); }
  catch (e) { showCopyFallback(text, "Copy manually"); }
}
function showCopyFallback(text, title) {
  modal({ title, cancel: "", ok: "Close",
    body: `<p class="small">Select all of the text below and copy it, then paste it into a note, email or message to Kovas.</p>
           <textarea readonly style="min-height:200px;font-size:12px" onclick="this.select()">${esc(text)}</textarea>` });
}
function hasProgress() {
  return Object.keys(S.ratings).length > 0 || Object.keys(S.notes).length > 0 || Object.keys(S.interview).some(k => k !== "rulesConfirmed" && S.interview[k] && (typeof S.interview[k] !== "object" || Object.keys(S.interview[k]).length));
}
function handleImport(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast("That file is too large to be a backup."); return; }
  const reader = new FileReader();
  reader.onerror = () => toast("Couldn't read that file.");
  reader.onload = () => {
    let incoming;
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || obj.schema !== SCHEMA || !obj.state) throw new Error("This isn't a Food Picker backup file.");
      incoming = sanitizeState(obj.state);
    } catch (e) {
      modal({ title: "Couldn't restore", cancel: "", ok: "OK",
              body: `<p>${esc(e.message || "The file couldn't be read.")}</p><p class="small muted">Your current answers were not changed.</p>` });
      return;
    }
    const n = Object.keys(incoming.ratings).length;
    const apply = () => {
      try { localStorage.setItem(LS_PREV, JSON.stringify(S)); } catch (e) { /* best effort */ }
      S = incoming; save(); render(true);
      toast(`Restored backup — ${n} meal answers`);
    };
    if (hasProgress()) {
      modal({ title: "Replace current answers?", ok: "Replace", danger: true, onOk: apply,
              body: `<p>This device currently has <b>${Object.keys(S.ratings).length}</b> meal answers. The backup has <b>${n}</b>.</p>
                     <p class="small muted">Tip: tap Backup first if you might want the current answers later.</p>` });
    } else apply();
  };
  reader.readAsText(file);
}

    ${unseen.map(row).join("")}</details></div>
  <div class="panel"><h3 style="font-size:20px">Your written answers</h3><dl class="answers">${answers}</dl>
    <button class="btn ghost" style="margin-top:14px" data-act="goInterview">✎ Edit my answers</button></div>
  <div class="stack">
    <button class="btn ghost" data-act="backToCards">← Back to meal cards</button>
    <button class="btn ghost" data-act="more">Show me ${MORE_COUNT} more meals</button>
  </div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, iv = S.interview;
  switch (act) {
    case "backup": exportJSON("backup"); break;
    case "exportFinal": exportJSON("final"); break;
    case "share": shareJSON(); break;
    case "copy": copyJSON(); break;
    case "summaryTxt": downloadText(`Lynsey_Food_Summary_${stamp()}.txt`, summaryText(), "text/plain"); toast("Downloaded readable summary"); break;
    case "import": document.getElementById("importFile").click(); break;
    case "reset":
      modal({ title: "Start over?", ok: "Erase & start over", danger: true,
        body: `<p>This erases all answers on this device. A backup file will download first, just in case.</p>`,
        onOk: () => { exportJSON("backup"); try { localStorage.setItem(LS_PREV, JSON.stringify(S)); } catch (err) {} S = freshState(); save(); render(true); } });
      break;
    case "resume": S.step = S.deck.length ? (S.pos >= S.deck.length ? "review" : "cards") : "interview"; save(); render(true); break;
    case "goInterview": S.step = "interview"; save(); render(true); break;
    case "ipPrev": if (S.ipage > 0) S.ipage--; else S.step = "welcome"; save(); render(true); break;
    case "ipNext":
      if (S.ipage === 0 && !iv.rulesConfirmed && !(iv.rulesNote || "").trim()) { toast("Please tap “Yes, these are correct” — or type a correction — first"); return; }
      S.ipage = Math.min(S.ipage + 1, PAGES.length - 1); save(); render(true);
      break;
    case "toCards":
      startCards();
      if (!S.lastExportAt) toast("💾 Tip: tap Backup (top right) now and then to keep a saved copy.", 4500);
      break;
    case "confirmRules": iv.rulesConfirmed = !iv.rulesConfirmed; el.classList.toggle("sel", iv.rulesConfirmed); save(); break;
    case "lvl": {
      const q = el.dataset.q, l = el.dataset.l, v = el.dataset.v; iv[q] = iv[q] || {};
      if (iv[q][l] === v) delete iv[q][l]; else iv[q][l] = v;
      el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === iv[q][l]));
      save(); break;
    }
    case "openNote": {
      noteOpen = true; render();
      const t = document.querySelector("textarea[data-mnote]"); if (t) t.focus();
      break;
    }
    case "rnote": {
      const id = el.dataset.id, inp = document.createElement("input");
      inp.type = "text"; inp.className = "rnote"; inp.dataset.mnote = id; inp.placeholder = "e.g. less garlic, add mushrooms";
      el.replaceWith(inp); inp.focus(); break;
    }
    case "multi": {
      const q = el.dataset.q, l = el.dataset.l; iv[q] = iv[q] || [];
      const i = iv[q].indexOf(l); if (i >= 0) iv[q].splice(i, 1); else iv[q].push(l);
      el.classList.toggle("sel", i < 0); save(); break;
    }
    case "single": {
      const q = el.dataset.q, l = el.dataset.l;
      iv[q] = iv[q] === l ? "" : l;
      el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("sel", c.dataset.l === iv[q]));
      save(); break;
    }
    case "rate": rate(el.dataset.r); break;
    case "skip": rate("skipped"); break;
    case "undo": undo(); break;
    case "back": if (S.pos > 0) { S.pos--; noteOpen = false; save(); render(); } break;
    case "more": addMoreMeals(); if (S.step !== "cards") { S.step = "cards"; save(); render(true); } break;
    case "toReview": S.step = "review"; save(); render(true); break;
    case "backToCards": S.step = "cards"; if (S.pos >= S.deck.length && S.deck.length) S.pos = S.deck.length; save(); render(true); break;
    case "setR": {
      const id = el.dataset.id, r = el.dataset.r;
      setRating(id, S.ratings[id] && S.ratings[id].r === r ? null : r);
      break;
    }
  }
});
document.addEventListener("input", e => {
  const d = e.target.dataset || {};
  if (d.text) { S.interview[d.text] = e.target.value.slice(0, 5000); saveSoon(); }
  else if (d.mnote && BY_ID[d.mnote]) {
    const t = e.target.value.slice(0, 1000);
    if (t.trim()) S.notes[d.mnote] = t; else delete S.notes[d.mnote];
    saveSoon();
  }
});
document.addEventListener("focusout", e => { if (e.target.dataset && (e.target.dataset.text || e.target.dataset.mnote)) save(); });
document.getElementById("importFile").addEventListener("change", e => { handleImport(e.target.files[0]); e.target.value = ""; });
document.addEventListener("keydown", e => {
  if (S.step !== "cards" || /INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.getElementById("modalRoot").innerHTML) return;
  const map = { "1": "love", "2": "like", "3": "maybe", "4": "no" };
  if (map[e.key]) rate(map[e.key]);
  else if (e.key === "s") rate("skipped");
  else if (e.key === "z" || e.key === "Backspace") { e.preventDefault(); undo(); }
  else if (e.key === "ArrowLeft" && S.pos > 0) { S.pos--; save(); render(); }
});
window.addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });

/* Optional swipe: right = Sounds good, left = No thanks. Buttons are the primary control. */
function bindSwipe() {
  const card = document.getElementById("card"); if (!card) return;
  let x0 = null, y0 = 0, dx = 0, dy = 0;
  card.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; dx = dy = 0; });
  card.addEventListener("pointermove", e => {
    if (x0 == null) return; dx = e.clientX - x0; dy = e.clientY - y0;
    if (Math.abs(dx) > Math.abs(dy)) card.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
  });
  const end = () => {
    if (x0 == null) return; x0 = null;
    if (Math.abs(dx) > 110 && Math.abs(dx) > 2 * Math.abs(dy)) rate(dx > 0 ? "like" : "no");
    else card.style.transform = "";
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end); card.addEventListener("pointerleave", end);
}

/* ---------- Boot ---------- */
load();
render(true);
if (storageOK) updatePill();
</script>
</body>
</html>
